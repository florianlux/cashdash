<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DropCharge Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1>DropCharge_ <span style="color:var(--text-dim)">/ admin</span></h1>
      <p>subscriber management</p>
    </header>

    <!-- Login -->
    <section id="login-section">
      <div class="card">
        <p>Enter admin token to continue.</p>
        <div class="form-group" style="margin-top:1rem">
          <input type="password" id="token-input" placeholder="admin token" />
          <button id="login-btn">Login</button>
        </div>
        <p class="msg error" id="login-msg" role="alert" aria-live="polite"></p>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-section" style="display:none">

      <div class="counters">
        <div class="counter-box">
          <span class="num" id="count-total">—</span>
          <span class="label">Active</span>
        </div>
        <div class="counter-box">
          <span class="num" id="count-24h">—</span>
          <span class="label">Last 24 h</span>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <select id="status-filter">
            <option value="active">Active</option>
            <option value="all">All</option>
          </select>
          <button class="secondary small" id="refresh-btn">Refresh</button>
          <button class="secondary small" id="export-btn">Export CSV</button>
          <button class="secondary small" id="logout-btn" style="margin-left:auto">Logout</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Email</th>
                <th>Created</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="subscribers-tbody">
              <tr><td colspan="4" class="loading">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <p class="msg" id="action-msg" role="status" aria-live="polite"></p>
      </div>

    </section>

    <footer class="site-footer">
      &copy; DropCharge &nbsp;·&nbsp; <a href="index.html">home</a>
    </footer>
  </div>

  <script src="admin.js"></script>
</body>
</html>
