<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DropCharge — Stay in the Loop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <h1>DropCharge_</h1>
      <p>newsletter · updates · drops</p>
    </header>

    <main>
      <div class="card">
        <p>Get notified about new drops, features, and exclusive previews.</p>
        <form id="signup-form" novalidate>
          <div class="form-group">
            <input
              type="email"
              id="email-input"
              placeholder="your@email.com"
              autocomplete="email"
              required
            />
            <button type="submit" id="submit-btn">Subscribe</button>
          </div>
          <p class="msg" id="msg" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      &copy; DropCharge &nbsp;·&nbsp; <a href="admin.html">admin</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
